name: Base de données

# Applique automatiquement les nouvelles migrations Supabase quand elles arrivent sur main.
# Nécessite le secret GitHub SUPABASE_DB_URL (adresse « Session pooler » de Supabase).
# Sans ce secret, l'étape se contente d'un message et ne bloque rien.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:
    inputs:
      script:
        description: 'Script ponctuel à lancer (fichier de supabase/nettoyage/), vide = migrations'
        required: false
        default: ''

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Appliquer les migrations
        if: ${{ github.event_name == 'push' || inputs.script == '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: node scripts/db/apply-migrations.mjs
      - name: Lancer le script ponctuel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.script != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCRIPT: ${{ inputs.script }}
        run: node scripts/db/apply-migrations.mjs --script "$SCRIPT"
