name: Tests

# Vérifie chaque modification avant sa mise en ligne :
# types TypeScript, tests automatiques (règles de prêt, sécurité SQL, BGG, serveur) et build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
